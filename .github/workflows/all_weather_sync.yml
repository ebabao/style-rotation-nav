name: 全天候策略每日同步

# 与参考工程一致：静态页面不变，只更新 all-weather/data 接口；
# 推送 main 后由既有 GitHub Pages（main / root）自动发布子站。

on:
  schedule:
    - cron: '20 11 * * *'  # UTC 11:20 = 北京时间 19:20
  workflow_dispatch:
    inputs:
      mode:
        description: 'sync(默认) | retrain(参数自进化) | force(强制重写接口)'
        required: false
        default: 'sync'
      no_refresh:
        description: '跳过抓数，用仓库内快照回放'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'all-weather/scripts/**'
      - 'all-weather/model/**'
      - '.github/workflows/all_weather_sync.yml'

permissions:
  contents: write

concurrency:
  group: all-weather-nav-sync
  cancel-in-progress: false

defaults:
  run:
    working-directory: all-weather

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: all-weather/requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 每日同步（抓数 → 回放 → 接口 → 校验 → 审计）
        run: |
          ARGS=""
          if [ "${{ inputs.no_refresh }}" = "true" ]; then ARGS="$ARGS --no-refresh"; fi
          if [ "${{ inputs.mode }}" = "retrain" ]; then ARGS="$ARGS --retrain"; fi
          if [ "${{ inputs.mode }}" = "force" ]; then ARGS="$ARGS --force"; fi
          python scripts/sync_daily.py $ARGS

      - name: 接口契约校验
        run: |
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path('data')
          need = ['meta.json', 'nav.json', 'signal.json', 'weights.json',
                  'rebalances.csv', 'monthly.csv', 'sync_audit.json']
          for name in need:
              p = root / name
              assert p.exists() and p.stat().st_size > 0, f'接口缺失: {name}'
          meta = json.loads((root / 'meta.json').read_text())
          nav = json.loads((root / 'nav.json').read_text())
          sig = json.loads((root / 'signal.json').read_text())
          assert meta['bars'] == len(nav['dates']) == len(nav['nav']) == len(nav['ret'])
          assert nav['dates'] == sorted(nav['dates']), '日期非单调'
          assert all(isinstance(v, (int, float)) for v in nav['nav']), '净值含非数值'
          assert meta['as_of'] == nav['as_of'] == sig['as_of'], 'as_of 不同步'
          assert isinstance(meta['reconcile']['max_abs_diff_pp'], (int, float))
          print(f"接口校验 PASS | as_of={meta['as_of']} bars={meta['bars']} "
                f"source={meta['sync']['source']} 对账={meta['reconcile']['max_abs_diff_pp']}pp")
          PY

      - name: 提交接口变更（无变化则跳过）
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add all-weather/data/ all-weather/model/active_params.json all-weather/model/state_snapshot.json all-weather/model/aw14_out/data/
          if git diff --cached --quiet; then
            echo "本次无数据变化，跳过提交（页面保持上一版）"
          else
            git commit -m "chore(nav): 更新全天候每日净值看板"
            git push
          fi
        working-directory: .
