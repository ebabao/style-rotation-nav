name: 全天候同步停更巡检

on:
  schedule:
    - cron: '40 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: 超过 26 小时未同步则自动重启
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            let hours = Infinity, note = '';
            try {
              const {data} = await github.rest.repos.getContent({
                owner, repo, path: 'all-weather/data/sync_audit.json', ref: 'main'
              });
              const a = JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
              const runs = (a && a.runs) || [];
              const last = runs.length ? runs[runs.length - 1].at : null;
              if (last) hours = (Date.now() - new Date(last).getTime()) / 3.6e6;
              note = `距上次巡检 ${Number.isFinite(hours) ? hours.toFixed(1) + 'h' : '未知'}`;
            } catch (e) {
              note = '审计文件读取失败: ' + e.message;
            }
            if (!Number.isFinite(hours) || hours > 26) {
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id: 'all_weather_sync.yml', ref: 'main',
                inputs: { mode: 'force' }
              });
              core.notice('全天候同步停更（' + note + '），已自动重启');
            } else {
              core.info('全天候同步正常：' + note + '（阈值 26h）');
            }
