# 全天候策略模型 v1.4 · 七只真实 ETF 进化学习版
# 相对 v1.3 的改动：样本换为 7 只真实可交易 ETF（彻底去掉指数代理拼接），
# 参数从「大类预算」下沉到「逐资产仓位倾斜」，学习器升级为遗传算法多代演化。
version: v1.4
seed: 20261108
product: 七只真实ETF + 四宫格风险平价 + 国债专属杠杆 + 逐资产仓位倾斜 + 遗传算法进化学习
baseline_version: v1.3
reference:
  title: 用户指定资产池（7 只真实 ETF）
  date: 2026-11-08
  core_points:
    - 资产池仅含 7 只真实 ETF，不使用任何指数代理、不拼接上市前数据、不编造
    - 共同可交易起点由最后上市的豆粕ETF(159985, 2019-12-05)决定
    - 目标：夏普高、回撤可控、收益优秀；不硬设 30% 年化

data:
  source: 新浪长历史日线(money.finance) + hfq.js 前复权因子（复用 v1.2 已验证链路）
  datalen: 4000
  retry_max: 2
  start: 2013-01-01
  end: 2030-12-31
  # 正式评估期：7 只都有真实价格的最早日(2019-12-05)的次日收益起点
  # 豆粕ETF 159985 于 2019-12-05 上市，首个可计收益日为 2019-12-06
  eval_start: 2019-12-06
  calendar: sh000300 沪深300指数交易日（A股）
  ffill_max_days: 5
  cost_bps: 5.0
  cost_side: double
  min_history: 120
  proxy_policy: 本版无代理。上市前保持缺席(NaN)，按规则重分配预算，绝不填充或编造
  return_method: log_return_single_source

# 7 只真实 ETF（代码 → 新浪符号）
universe:
  TB5:    {sym: sh511010, name: 国债ETF,        code: "511010", quadrant: BD}
  GOLD:   {sym: sh518880, name: 黄金ETF,        code: "518880", quadrant: GD}
  SOY:    {sym: sz159985, name: 豆粕ETF,        code: "159985", quadrant: CM}
  DIVLV:  {sym: sh512890, name: 红利低波ETF,    code: "512890", quadrant: EQ}
  SP500:  {sym: sh513500, name: 标普500ETF,     code: "513500", quadrant: EQ}
  NDX:    {sym: sh513100, name: 纳指100ETF,     code: "513100", quadrant: EQ}
  GEM50:  {sym: sz159949, name: 创业板50ETF,    code: "159949", quadrant: EQ}

quadrants:
  EQ: [DIVLV, SP500, NDX, GEM50]
  BD: [TB5]
  GD: [GOLD]
  CM: [SOY]

risk_parity:
  cov_windows: [60, 120, 250]
  cov_alphas: [0.2, 0.3, 0.5]
  shrinkage: 0.20
  class_return_method: equal_weight
  intra_class_method: inverse_vol_times_tilt

bond_leverage:
  enabled: true
  note: 债券大类名义权重乘以专属杠杆，超出100%由融资腿承接；融资按年化2%计息（保守）
  max_total_exposure: 3.0
  financing_annual: 0.02

rebalance:
  frequency: quarterly
  band: 0.03
  force_on_universe_change: true
  execution_lag: T+1

drawdown_brake:
  enabled: true
  note: 滚动1年高点回撤超过阈值时按比例降杠杆，最低保留0.6倍；避免历史最高净值锁死问题

learning:
  method: genetic_algorithm        # 遗传算法：种群→锦标赛选择→算术交叉→高斯变异→精英保留
  population: 24
  generations: 8
  elite_keep: 4
  crossover_rate: 0.7
  mutation_sigma_start: 0.35
  mutation_sigma_end: 0.08
  complexity_penalty: 0.005
  split: [train, valid, test]
  train_range: [2019-12-06, 2023-12-31]
  valid_range: [2024-01-01, 2025-06-30]
  test_range:  [2025-07-01, 2026-11-08]
  # 目标函数：三重目标（夏普高/回撤可控/收益优秀），显式抑制「缩杠杆刷夏普」套利
  objective_weights: {sharpe: 0.25, calmar: 0.20, cagr: 0.55}
  cagr_floor: 0.08            # 年化收益底线，低于此值重罚
  cagr_floor_penalty: 5.0
  mdd_limit: 0.065           # 目标函数内部回撤约束（比对外 8% 更严，留设计余量）
  mdd_penalty: 8.0
  turnover_penalty: 0.12
  note: 收益权重最高并设 8% 年化底线，避免学习器把总敞口压到下限刷高夏普却牺牲收益

evolution:
  retrain_freq: quarterly
  champion_challenger: true
  versioned_params: true
  rollback_available: true
  audit_log: true

recursive_test:
  window: expanding
  min_train: 500
  step: 40
  forbid_lookahead: true

targets:                # 本版为用户定性目标，仅用于达成度披露，不作为硬学习目标
  sharpe_min: 1.50
  mdd_max: 0.08
  cagr_min: 0.10
